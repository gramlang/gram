[package]
name = "gram"
version = "0.1.0"
edition = "2024"
description = "A programming language for distributed systems."
documentation = "https://github.com/gramlang/gram"
readme = "README.md"
repository = "https://github.com/gramlang/gram"
license = "MIT"

[dependencies]
clap = { version = "4.6.8", features = ["derive", "wrap_help"] }
clap_complete = "4.6.12"
colored = "3.1.1"
num-bigint = "0.5.1"
unicode-segmentation = "1.13.3"

[lints]
clippy.all = { level = "deny", priority = -1 }
clippy.default_numeric_fallback = "deny"
clippy.pedantic = { level = "deny", priority = -1 }
rust.warnings = "deny"
